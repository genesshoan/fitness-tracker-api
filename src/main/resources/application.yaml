spring:
  application:
    name: fitness-tracker-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

application:
  security:
    jwt:
      secret: ${SECRET_KEY}
      expiration: ${JWT_KEY_EXPIRATION}
      refresh-token:
        expiration: ${JWT_REFRESH_KEY_EXPIRATION}

logging:
  level:
    org:
      hibernate:
        SQL: WARN

file:
  upload:
    profile-picture:
      max-size: ${PROFILE_PICTURE_MAX_SIZE}
      allowed-types: ${PROFILE_PICTURE_ALLOWED_TYPES}

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT}
    bucket: ${MINIO_BUCKET}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
