spring:
  application:
    name: fitness-tracker-api

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mail:
  from: ${MAIL_FROM}
  from-name: ${MAIL_FROM_NAME}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:${SPRING_ACTIVE_PROFILES:prod}}
