spring:
  application:
    name: fitness-tracker-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:${SPRING_ACTIVE_PROFILES:prod}}

file:
  upload:
    profile-picture:
      max-size: ${PROFILE_PICTURE_MAX_SIZE}
      allowed-types: ${PROFILE_PICTURE_ALLOWED_TYPES}

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT}
    bucket: ${MINIO_BUCKET}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
