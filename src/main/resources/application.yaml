spring:
  application:
    name: fitness-tracker-api

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

logging:
  level:
    org:
      hibernate:
        SQL: WARN

app:
  name: Fitness Tracker

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,HEAD,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    exposed-headers: ${CORS_EXPOSED_HEADERS:}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:1h}

  auth:
    jwt:
      secret: ${SECRET_KEY}
      access-token-expiration: ${JWT_KEY_EXPIRATION}

    refresh-token:
      expiration: ${JWT_REFRESH_KEY_EXPIRATION}
      cookie-secure: ${REFRESH_COOKIE_SECURE}

  verification:
    email-verification-expiration: ${VERIFICATION_EMAIL_EXPIRATION}
    password-reset-expiration: ${PASSWORD_RESET_EXPIRATION}

  file:
    upload:
      profile-picture:
        max-size: ${PROFILE_PICTURE_MAX_SIZE}
        allowed-types: ${PROFILE_PICTURE_ALLOWED_TYPES}
        min-dimension: ${PROFILE_PICTURE_MIN_DIMENSION}
        max-pixels: ${PROFILE_PICTURE_MAX_PIXELS}
        output-size: ${PROFILE_PICTURE_OUTPUT_SIZE}
        output-quality: ${PROFILE_PICTURE_OUTPUT_QUALITY}
        output-format: ${PROFILE_PICTURE_OUTPUT_FORMAT}
    get:
      catalog:
        base-url: ${STORAGE_CATALOG_BASE_URL}
        exercise:
          gifs: ${STORAGE_CATALOG_EXERCISE_GIF}
          thumbnails: ${STORAGE_CATALOG_EXERCISE_THUMBNAIL}

  storage:
    endpoint: ${STORAGE_ENDPOINT}
    region: ${STORAGE_REGION}
    bucket: ${STORAGE_BUCKET}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    path-style: ${STORAGE_PATH_STYLE}
    presigned-url-expiration: ${STORAGE_PRESIGNED_URL_EXPIRATION}

  mail:
    from: ${MAIL_FROM}
    from-name: ${MAIL_FROM_NAME}
    logo-url: ${MAIL_LOGO_URL}
    frontend-url: ${FRONTEND_URL}
