services:
  api:
    image: ghcr.io/genesshoan/fitness-tracker-api:${APP_VERSION:?APP_VERSION must be set}
    restart: unless-stopped

    networks:
      - proxy
      - ps_db

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:?DB_NAME must be set}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      JWT_KEY_EXPIRATION: ${JWT_KEY_EXPIRATION:?JWT_KEY_EXPIRATION must be set}
      JWT_REFRESH_KEY_EXPIRATION: ${JWT_REFRESH_KEY_EXPIRATION:?JWT_REFRESH_KEY_EXPIRATION must be set}
      AUTH_CLEANUP_CRON: ${AUTH_CLEANUP_CRON:-0 0 3 * * *}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:?REFRESH_COOKIE_SECURE must be set}
      VERIFICATION_EMAIL_EXPIRATION: ${VERIFICATION_EMAIL_EXPIRATION:?VERIFICATION_EMAIL_EXPIRATION must be set}
      PASSWORD_RESET_EXPIRATION: ${PASSWORD_RESET_EXPIRATION:?PASSWORD_RESET_EXPIRATION must be set}
      IP_PROVIDER: ${IP_PROVIDER:?IP_PROVIDER must be set}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT must be set}
      STORAGE_REGION: ${STORAGE_REGION:?STORAGE_REGION must be set}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET must be set}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY must be set}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY must be set}
      STORAGE_PATH_STYLE: ${STORAGE_PATH_STYLE:?STORAGE_PATH_STYLE must be set}
      STORAGE_PRESIGNED_URL_EXPIRATION: ${STORAGE_PRESIGNED_URL_EXPIRATION:?STORAGE_PRESIGNED_URL_EXPIRATION must be set}
      STORAGE_CATALOG_BASE_URL: ${STORAGE_CATALOG_BASE_URL:?STORAGE_CATALOG_BASE_URL must be set}
      PROFILE_PICTURE_MAX_SIZE: ${PROFILE_PICTURE_MAX_SIZE:?PROFILE_PICTURE_MAX_SIZE must be set}
      PROFILE_PICTURE_ALLOWED_TYPES: ${PROFILE_PICTURE_ALLOWED_TYPES:?PROFILE_PICTURE_ALLOWED_TYPES must be set}
      PROFILE_PICTURE_MIN_DIMENSION: ${PROFILE_PICTURE_MIN_DIMENSION:?PROFILE_PICTURE_MIN_DIMENSION must be set}
      PROFILE_PICTURE_MAX_PIXELS: ${PROFILE_PICTURE_MAX_PIXELS:?PROFILE_PICTURE_MAX_PIXELS must be set}
      PROFILE_PICTURE_OUTPUT_SIZE: ${PROFILE_PICTURE_OUTPUT_SIZE:?PROFILE_PICTURE_OUTPUT_SIZE must be set}
      PROFILE_PICTURE_OUTPUT_QUALITY: ${PROFILE_PICTURE_OUTPUT_QUALITY:?PROFILE_PICTURE_OUTPUT_QUALITY must be set}
      PROFILE_PICTURE_OUTPUT_FORMAT: ${PROFILE_PICTURE_OUTPUT_FORMAT:?PROFILE_PICTURE_OUTPUT_FORMAT must be set}
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST must be set}
      MAIL_PORT: ${MAIL_PORT:?MAIL_PORT must be set}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME must be set}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD must be set}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM must be set}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:?MAIL_FROM_NAME must be set}
      MAIL_LOGO_URL: ${MAIL_LOGO_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,PATCH,DELETE,HEAD,OPTIONS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-*}
      CORS_EXPOSED_HEADERS: ${CORS_EXPOSED_HEADERS:-}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      CORS_MAX_AGE: ${CORS_MAX_AGE:-1h}

networks:
  proxy:
    external: true
  ps_db:
    external: true
